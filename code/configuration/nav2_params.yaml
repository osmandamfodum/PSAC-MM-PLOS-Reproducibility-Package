amcl:
  ros__parameters:
    use_sim_time: true

    # RC11: Gazebo odometry was measured against ground truth and is
    # effectively exact, so avoid injecting excessive artificial motion noise
    # into the AMCL particle filter.
    alpha1: 0.01
    alpha2: 0.01
    alpha3: 0.01
    alpha4: 0.01
    alpha5: 0.01

    # Explicitly match the mission manager's motion-aware AMCL policy.
    # These were previously implicit Humble defaults; making them explicit
    # prevents configuration drift across machines/runs.
    update_min_d: 0.25
    update_min_a: 0.20

    base_frame_id: base_footprint
    odom_frame_id: odom
    global_frame_id: map

    scan_topic: /scan

    laser_min_range: 0.3
    laser_max_range: 12.0

    set_initial_pose: true

    initial_pose:
      x: 0.0
      y: 0.0
      z: 0.0
      yaw: 1.57


map_server:
  ros__parameters:
    use_sim_time: true
    yaml_filename: ''


map_saver:
  ros__parameters:
    use_sim_time: true


bt_navigator:
  ros__parameters:

    use_sim_time: true

    global_frame: map
    robot_base_frame: base_footprint
    odom_topic: /odom

    bt_loop_duration: 10

    default_server_timeout: 30

    plugin_lib_names:

    - nav2_compute_path_to_pose_action_bt_node
    - nav2_compute_path_through_poses_action_bt_node

    - nav2_smooth_path_action_bt_node

    - nav2_follow_path_action_bt_node

    - nav2_spin_action_bt_node
    - nav2_wait_action_bt_node
    - nav2_back_up_action_bt_node
    - nav2_drive_on_heading_bt_node

    - nav2_clear_costmap_service_bt_node

    - nav2_is_stuck_condition_bt_node
    - nav2_goal_reached_condition_bt_node
    - nav2_goal_updated_condition_bt_node
    - nav2_globally_updated_goal_condition_bt_node

    - nav2_is_path_valid_condition_bt_node

    - nav2_initial_pose_received_condition_bt_node

    - nav2_reinitialize_global_localization_service_bt_node

    - nav2_rate_controller_bt_node
    - nav2_distance_controller_bt_node
    - nav2_speed_controller_bt_node

    - nav2_truncate_path_action_bt_node
    - nav2_truncate_path_local_action_bt_node

    - nav2_goal_updater_node_bt_node

    - nav2_recovery_node_bt_node

    - nav2_pipeline_sequence_bt_node
    - nav2_round_robin_node_bt_node

    - nav2_transform_available_condition_bt_node

    - nav2_time_expired_condition_bt_node

    - nav2_distance_traveled_condition_bt_node

    - nav2_single_trigger_bt_node

    - nav2_remove_passed_goals_action_bt_node

    - nav2_wait_cancel_bt_node
    - nav2_spin_cancel_bt_node
    - nav2_back_up_cancel_bt_node
    - nav2_drive_on_heading_cancel_bt_node



controller_server:

  ros__parameters:

    use_sim_time: true


    controller_frequency: 20.0


    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001


    failure_tolerance: 0.4


    progress_checker_plugin: progress_checker


    goal_checker_plugins:
    - general_goal_checker


    controller_plugins:
    - FollowPath



    progress_checker:

      plugin: nav2_controller::SimpleProgressChecker

      required_movement_radius: 0.15

      movement_time_allowance: 10.0



    general_goal_checker:

      plugin: nav2_controller::SimpleGoalChecker

      xy_goal_tolerance: 0.25

      yaw_goal_tolerance: 6.28

      stateful: false



    FollowPath:

      plugin: dwb_core::DWBLocalPlanner


      debug_trajectory_details: false


      min_vel_x: -0.05

      max_vel_x: 0.30


      min_vel_y: 0.0
      max_vel_y: 0.0


      max_vel_theta: 0.65

      min_speed_xy: 0.0

      max_speed_xy: 0.30

      min_speed_theta: 0.05



      acc_lim_x: 0.45

      acc_lim_y: 0.0

      acc_lim_theta: 0.9



      decel_lim_x: -0.45

      decel_lim_y: 0.0

      decel_lim_theta: -0.9



      vx_samples: 30

      vy_samples: 1

      vtheta_samples: 45



      sim_time: 2.0



      linear_granularity: 0.05

      angular_granularity: 0.025


      transform_tolerance: 0.3



      xy_goal_tolerance: 0.25


      trans_stopped_velocity: 0.03



      short_circuit_trajectory_evaluation: true


      stateful: false



      critics:

      - RotateToGoal
      - Oscillation
      - BaseObstacle
      - GoalAlign
      - PathAlign
      - PathDist
      - GoalDist



      BaseObstacle.scale: 10.0

      Oscillation.scale: 8.0

      PathAlign.scale: 24.0

      GoalAlign.scale: 12.0

      PathDist.scale: 24.0

      GoalDist.scale: 16.0

      RotateToGoal.scale: 5.0




planner_server:

  ros__parameters:

    use_sim_time: true


    expected_planner_frequency: 5.0


    planner_plugins:
    - GridBased



    GridBased:

      plugin: nav2_navfn_planner/NavfnPlanner


      tolerance: 0.75


      use_astar: true


      allow_unknown: false





smoother_server:

  ros__parameters:

    use_sim_time: true


    smoother_plugins:

    - simple_smoother


    simple_smoother:

      plugin: nav2_smoother::SimpleSmoother

      tolerance: 1.0e-10

      max_its: 500

      do_refinement: true





behavior_server:

  ros__parameters:

    use_sim_time: true


    global_frame: odom

    robot_base_frame: base_footprint


    transform_tolerance: 0.3


    simulate_ahead_time: 1.5


    max_rotational_vel: 0.5

    min_rotational_vel: 0.08

    rotational_acc_lim: 0.8



    behavior_plugins:

    - spin

    - backup

    - drive_on_heading

    - wait



    spin:

      plugin: nav2_behaviors/Spin


    backup:

      plugin: nav2_behaviors/BackUp


    drive_on_heading:

      plugin: nav2_behaviors/DriveOnHeading


    wait:

      plugin: nav2_behaviors/Wait





local_costmap:

  local_costmap:

    ros__parameters:

      use_sim_time: true


      update_frequency: 10.0

      publish_frequency: 5.0

      # Home safety diagnostics consume full grids, including while stationary.
      always_send_full_costmap: true


      global_frame: odom

      robot_base_frame: base_footprint


      rolling_window: true


      width: 10

      height: 10


      resolution: 0.05


      footprint: "[[0.23, 0.22], [0.23, -0.22], [-0.27, -0.22], [-0.27, 0.22]]"



      plugins:

      - obstacle_layer

      - inflation_layer



      obstacle_layer:

        plugin: nav2_costmap_2d::ObstacleLayer


        enabled: true


        observation_sources: scan


        scan:

          topic: /scan

          data_type: LaserScan


          marking: true

          clearing: true


          raytrace_max_range: 10.0

          obstacle_max_range: 6.0



      inflation_layer:

        plugin: nav2_costmap_2d::InflationLayer


        inflation_radius: 0.65


        cost_scaling_factor: 4.0






global_costmap:

  global_costmap:

    ros__parameters:


      use_sim_time: true


      update_frequency: 3.0

      publish_frequency: 2.0



      # Mission safety subscriber consumes complete OccupancyGrid messages.
      always_send_full_costmap: true

      global_frame: map

      robot_base_frame: base_footprint



      resolution: 0.05


      footprint: "[[0.23, 0.22], [0.23, -0.22], [-0.27, -0.22], [-0.27, 0.22]]"



      track_unknown_space: true



      plugins:

      - static_layer

      - obstacle_layer

      - inflation_layer



      static_layer:

        plugin: nav2_costmap_2d::StaticLayer


        map_subscribe_transient_local: true



      obstacle_layer:

        plugin: nav2_costmap_2d::ObstacleLayer


        enabled: true


        observation_sources: scan


        scan:

          topic: /scan

          data_type: LaserScan


          marking: true

          clearing: true


          raytrace_max_range: 12.0

          obstacle_max_range: 8.0



      inflation_layer:

        plugin: nav2_costmap_2d::InflationLayer


        inflation_radius: 0.75


        cost_scaling_factor: 3.0





waypoint_follower:

  ros__parameters:

    use_sim_time: true

    loop_rate: 20

    stop_on_failure: false





velocity_smoother:

  ros__parameters:

    use_sim_time: true


    smoothing_frequency: 30.0


    feedback: OPEN_LOOP


    max_velocity:

    - 0.30
    - 0.0
    - 0.65


    min_velocity:

    - -0.05
    - 0.0
    - -0.65


    max_accel:

    - 0.45
    - 0.0
    - 0.9


    max_decel:

    - -0.45
    - 0.0
    - -0.9


    odom_topic: odom

    odom_duration: 0.1





lifecycle_manager:

  ros__parameters:

    use_sim_time: true


    autostart: true


    node_names:

    - map_server
    - amcl
    - controller_server
    - planner_server
    - smoother_server
    - behavior_server
    - bt_navigator
    - waypoint_follower
    - velocity_smoother

collision_monitor:
  ros__parameters:
    use_sim_time: true

    base_frame_id: "base_footprint"
    odom_frame_id: "odom"

    cmd_vel_in_topic: "/cmd_vel"
    cmd_vel_out_topic: "/cmd_vel_safe"

    transform_tolerance: 0.5
    source_timeout: 1.0
    base_shift_correction: true
    stop_pub_timeout: 2.0

    polygons: ["StopZone", "SlowZone"]

    StopZone:
      type: "polygon"
      points: [0.45, 0.32, 0.45, -0.32, -0.35, -0.32, -0.35, 0.32]
      action_type: "stop"
      max_points: 3
      visualize: true
      polygon_pub_topic: "/collision_monitor/stop_zone"
      enabled: true

    SlowZone:
      type: "polygon"
      points: [0.80, 0.45, 0.80, -0.45, -0.50, -0.45, -0.50, 0.45]
      action_type: "slowdown"
      max_points: 3
      slowdown_ratio: 0.30
      visualize: true
      polygon_pub_topic: "/collision_monitor/slow_zone"
      enabled: true

    observation_sources: ["scan"]

    scan:
      type: "scan"
      topic: "/scan"
      enabled: true
